name: Bump and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump (vMAJOR.MINOR.PATCH)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          BUMP="${{ inputs.bump }}"
          CURRENT=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version in build.zig.zon: ${CURRENT}" >&2
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump: ${BUMP}" >&2; exit 1 ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
          if ! grep -q "simutex ${CURRENT}" src/main.zig; then
            echo "src/main.zig does not contain current version ${CURRENT}" >&2
            exit 1
          fi

          sed -i "s/\.version = \"${CURRENT}\"/.version = \"${VERSION}\"/" build.zig.zon
          sed -i "s/simutex ${CURRENT}/simutex ${VERSION}/" src/main.zig

          echo "Bumped ${CURRENT} -> ${VERSION} (${BUMP})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.zig.zon src/main.zig
          git commit -m "chore(release): ${TAG}"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

  release:
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.bump.outputs.version }}
    secrets: inherit
