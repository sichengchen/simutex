name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: Version without the leading v (e.g. 0.1.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-aarch64-macos-0.16.0/zig" version

      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          ZON_VERSION=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          if [ "$VERSION" != "$ZON_VERSION" ]; then
            echo "Tag version ($VERSION) does not match build.zig.zon ($ZON_VERSION)" >&2
            exit 1
          fi
          if ! grep -q "simutex ${VERSION}" src/main.zig; then
            echo "src/main.zig version string does not match ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Create binary tarball
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp zig-out/bin/simutex dist/
          ARCHIVE="dist/simutex-${VERSION}-macos-arm64.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C dist simutex
          SHA=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/simutex-${{ steps.version.outputs.version }}-macos-arm64.tar.gz
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        if: env.GH_TOKEN != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ steps.package.outputs.sha256 }}"
          REPO="sichengchen/simutex"
          TAP_REPO="sichengchen/homebrew-tap"
          ASSET="simutex-${VERSION}-macos-arm64.tar.gz"
          BRANCH="release/simutex-${TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh auth setup-git
          gh repo clone "${TAP_REPO}" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          git checkout -b "${BRANCH}" origin/main
          mkdir -p Formula

          cat > Formula/simutex.rb <<FORMULA
          class Simutex < Formula
            desc "Tiny mutex for iOS Simulators"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
            sha256 "${SHA}"
            license "MIT"

            depends_on :macos
            depends_on arch: :arm64

            def install
              bin.install "simutex"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/simutex version")
            end
          end
          FORMULA

          git add Formula/simutex.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date for ${TAG}; skipping tap PR."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Update simutex to ${TAG}"
          git push -u --force-with-lease origin "${BRANCH}"

          pr_url=$(gh pr create \
            --repo "${TAP_REPO}" \
            --base main \
            --head "${BRANCH}" \
            --title "Update simutex to ${TAG}" \
            --body "Automated binary formula update from ${REPO}@${TAG}.")
          gh pr merge --repo "${TAP_REPO}" --squash --delete-branch "${pr_url}"
